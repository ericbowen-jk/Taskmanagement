{% extends "base.html" %}

{% block title %}Delete task{% endblock %}

{% block content %}
    <h1>Delete task</h1>
    <section class="panel">
        <p>Are you sure you want to delete <strong>{{ task.title }}</strong>?</p>
        <form method="post" class="form-actions">
            {% csrf_token %}
            <button class="button danger" type="submit">Delete task</button>
            <a href="{% url 'task_detail' task.pk %}">Cancel</a>
        </form>
    </section>
{% endblock %}
