<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Task Manager{% endblock %} | Task Manager</title>
    <style>
        :root {
            color: #172033;
            background: #f3f5f9;
            font-family: system-ui, sans-serif;
        }

        body {
            margin: 0;
            padding: 3rem 1rem;
        }

        main {
            max-width: 760px;
            margin: 0 auto;
        }

        h1, h2, p {
            margin-top: 0;
        }

        a {
            color: #3156a6;
        }

        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .page-header h1 {
            margin-bottom: 0.25rem;
        }

        .muted, .task-copy p, .empty-state p {
            color: #586174;
        }

        .button {
            display: inline-block;
            padding: 0.65rem 1rem;
            border: 0;
            border-radius: 8px;
            background: #3156a6;
            color: #fff;
            font: inherit;
            text-decoration: none;
            cursor: pointer;
        }

        .task-list {
            display: grid;
            gap: 1rem;
            padding: 0;
            list-style: none;
        }

        .task-card, .panel, .empty-state {
            padding: 1.25rem;
            border: 1px solid #e1e5ed;
            border-radius: 12px;
            background: #fff;
        }

        .task-card {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 1rem;
        }

        .task-copy h2 {
            margin-bottom: 0.5rem;
            font-size: 1.1rem;
        }

        .task-copy p {
            margin-bottom: 0.75rem;
        }

        .task-actions {
            display: flex;
            gap: 0.75rem;
            white-space: nowrap;
        }

        .status {
            font-size: 0.9rem;
        }

        .complete {
            color: #18764a;
        }

        .pending {
            color: #8a5a00;
        }

        .empty-state {
            text-align: center;
        }

        .form-fields p {
            display: grid;
            gap: 0.4rem;
        }

        .form-fields input:not([type="checkbox"]), .form-fields textarea {
            box-sizing: border-box;
            width: 100%;
            padding: 0.65rem;
            border: 1px solid #b8c0ce;
            border-radius: 6px;
            font: inherit;
        }

        .form-actions {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-top: 1.25rem;
        }

        .danger {
            background: #a52e37;
        }

        @media (max-width: 520px) {
            .page-header, .task-card {
                align-items: stretch;
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
