{% extends "base.html" %}

{% block title %}{{ page_title }}{% endblock %}

{% block content %}
    <h1>{{ page_title }}</h1>
    <section class="panel">
        <form method="post" class="form-fields">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="form-actions">
                <button class="button" type="submit">{{ submit_label }}</button>
                <a href="{% url 'home' %}">Cancel</a>
            </div>
        </form>
    </section>
{% endblock %}
